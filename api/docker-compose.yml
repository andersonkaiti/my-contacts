services:
  db:
    image: postgres:18-alpine
    container_name: mycontacts_db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${HOST}
      - POSTGRES_PORT=${PORT}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=${DATABASE}
    ports:
      - "${PORT}:${PORT}"
