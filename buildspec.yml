version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24

  pre_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/web && yarn install --frozen-lockfile

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/web && yarn build

  post_build:
    commands:
      - aws s3 sync --delete $CODEBUILD_SRC_DIR/web/dist s3://${BUCKET_NAME}
      - aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_ID} --paths /index.html
